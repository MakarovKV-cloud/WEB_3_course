<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        function counter(n) {
            let current = n;
            
            const intervalId = setInterval(() => {
                console.log(current);
                
                if (current === 0) {
                    clearInterval(intervalId);
                }
                
                current--;
            }, 1000);
        }
        counter(5);

        function createCounter(n) {
            let current = n;
            let intervalId = null;
            let isRunning = false;
            
            function tick() {
                console.log(current);
                
                if (current === 0) {
                    stop();
                } else {
                    current--;
                }
            }
            
            function start() {
                if (isRunning || current < 0) {
                    return;
                }
                
                console.log(current);
                
                if (current > 0) {
                    intervalId = setInterval(() => {
                        if (current > 0) {
                            current--;
                            console.log(current);
                            
                            if (current === 0) {
                                stop();
                            }
                        }
                    }, 1000);
                    isRunning = true;
                }
            }
            
            function pause() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                    isRunning = false;
                }
            }
            
            function stop() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                current = n;
                isRunning = false;
            }
            
            return {
                start,
                pause,
                stop
            };
        }


    const counter2 = createCounter(10);
    counter2.start();
        
    </script>
</head>
