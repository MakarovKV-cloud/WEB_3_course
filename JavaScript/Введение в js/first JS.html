<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="script.js"></script>
    <script>
        let a1 = Number(prompt("Первое число?", 1));
        let b1 = Number(prompt("Второе число?", 2));
        console.log(a1 + b1);
    </script>

<body>

    <script>
        for (let i =2; i<=10;i+=2){
            console.log(i)
        }
    </script>
    <script>
        let i = 0;
        while (i<3){
            console.log(`number ${i}!`);
            i++;
        }
    </script>
    <script>
        while(true){
            let a5 = prompt("Введите число больше 100");
            if (a5 === null) break;
            else if (number(a5)<101) console.log(`${a5} не больше 100`);
            else break;

        }
    </script>
    <script>
        let start = Number(prompt("Введите начало интервала", 2));
        let end = Number(prompt("Введите конец интервала"));

        if (start < 2 || end < 2) {
            console.log("Числа должны быть положительными и не меньше 2");
        } 
        else if (end < start) {
            console.log("Конец диапазона должен быть больше начала");
        } 
        else {
            console.log(`Простые числа в интервале от ${start} до ${end}:`);
            
            for (let num = start; num <= end; num++) {
                let isPrime = true;       
                if (num === 2) {
                    isPrime = true;
                } 
                else if (num % 2 === 0) {
                    isPrime = false;
                } 
                else {
                    for (let i = 3; i <= Math.sqrt(num); i += 2) {
                        if (num % i === 0) {
                            isPrime = false;
                            break;
                        }
                    }
                }
                
                if (isPrime) {
                    console.log(num);
                }
            }
        }   
    </script>
</body>
